name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without v)
        required: true
        type: string
      publish:
        description: Publish verified wheels to PyPI and GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: cp311-*
          CIBW_SKIP: '*-musllinux* *-win32 *-manylinux_i686'
          CIBW_ARCHS: native
      - name: Inspect and install the wheel
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/check_wheel.py "$RELEASE_VERSION" wheelhouse/*.whl
          python -m pip install twine pytest 'bcrypt>=5' wheelhouse/*.whl
          python -m twine check --strict wheelhouse/*.whl
          httpcrabber --version
          python -m pytest -o pythonpath= -p no:warnings
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test the same stable-ABI wheel on Python 3.12
        shell: bash
        run: |
          python -m pip install pytest wheelhouse/*.whl
          python -m pytest -o pythonpath= -p no:warnings
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  pypi:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/httpcrabber/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          awk -v version="## [$VERSION]" 'index($0,version)==1 {found=1;next} found && /^## / {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" dist/*.whl --target "$GITHUB_SHA" --title "httpcrabber $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
