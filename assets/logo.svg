<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="httpcrabber">
  <title>httpcrabber</title>
  <defs>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="0.55" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2fd0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#39ff14" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="880" height="220" rx="16" fill="#0b0f0c"/>
  <rect width="880" height="220" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="219" rx="16" fill="none" stroke="#ff2fd0" stroke-opacity="0.5"/>

  <!-- crab -->
  <g transform="translate(120 112)" filter="url(#glow)">
    <!-- legs -->
    <g stroke="#ff5a36" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M-46 8 L-84 -10 L-104 12"/>
      <path d="M-50 22 L-90 24 L-108 48"/>
      <path d="M-42 34 L-72 56 L-84 82"/>
      <path d="M46 8 L84 -10 L104 12"/>
      <path d="M50 22 L90 24 L108 48"/>
      <path d="M42 34 L72 56 L84 82"/>
    </g>
    <!-- claws -->
    <g fill="#ff5a36">
      <path d="M-58 -14 C-92 -40 -132 -34 -136 -2 C-120 -4 -108 6 -104 18 C-92 14 -84 4 -78 -6 C-88 -10 -94 -16 -100 -22 C-84 -28 -70 -24 -58 -14 Z"/>
      <path d="M58 -14 C92 -40 132 -34 136 -2 C120 -4 108 6 104 18 C92 14 84 4 78 -6 C88 -10 94 -16 100 -22 C84 -28 70 -24 58 -14 Z"/>
    </g>
    <!-- body -->
    <ellipse cx="0" cy="14" rx="58" ry="42" fill="#ff5a36"/>
    <ellipse cx="0" cy="22" rx="42" ry="24" fill="#ff7a5a" opacity="0.55"/>
    <!-- eyes -->
    <g stroke="#ff5a36" stroke-width="5" stroke-linecap="round">
      <line x1="-18" y1="-14" x2="-24" y2="-40"/>
      <line x1="18" y1="-14" x2="24" y2="-40"/>
    </g>
    <circle cx="-24" cy="-44" r="10" fill="#ffffff"/>
    <circle cx="24" cy="-44" r="10" fill="#ffffff"/>
    <circle cx="-22" cy="-44" r="5" fill="#0b0f0c"/>
    <circle cx="26" cy="-44" r="5" fill="#0b0f0c"/>
    <circle cx="-20" cy="-46" r="1.8" fill="#ffffff"/>
    <circle cx="28" cy="-46" r="1.8" fill="#ffffff"/>
    <!-- mouth -->
    <path d="M-10 32 Q0 40 10 32" stroke="#0b0f0c" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace">
    <text x="300" y="112" font-size="72" font-weight="700" fill="url(#txt)" filter="url(#glow)">httpcrabber</text>
    <text x="304" y="150" font-size="18" fill="#00e5ff" opacity="0.9">network-level traffic interceptor · invisible to in-page JS</text>
    <text x="304" y="178" font-size="14" fill="#5f6f5f">Chrome ──▶ mitmproxy ──▶ bridge ──▶ upstream proxy ──▶ target</text>
  </g>
</svg>
