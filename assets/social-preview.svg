    <text x="564" y="304" font-size="27" fill="#d6ded6">Network-level traffic interceptor</text>
    <text x="564" y="342" font-size="27" fill="#d6ded6">for reverse-engineering web APIs.</text>
    <text x="564" y="390" font-size="21" fill="#00e5ff">invisible to in-page JavaScript protections</text>

