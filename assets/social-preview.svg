<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="httpcrabber — network-level traffic interceptor">
  <title>httpcrabber — network-level traffic interceptor</title>
  <defs>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="0.55" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2fd0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.22" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a36" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff5a36" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.85" cy="0.1" r="0.6">
